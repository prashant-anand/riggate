name: release

on:
  push:
    tags:
      - 'v*'
  # Lets the whole matrix run from the Actions tab, so the musl link can be proven before a
  # release tag exists.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: riggate-x86_64-unknown-linux-musl
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: riggate-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package and checksum
        shell: bash
        run: |
          install -m 755 target/${{ matrix.target }}/release/riggate ${{ matrix.archive }}
          if command -v sha256sum >/dev/null; then
            sha256sum ${{ matrix.archive }} > ${{ matrix.archive }}.sha256
          else
            shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  publish-crate:
    name: Publish to crates.io
    needs: build
    # The tag is the version boundary. crates.io versions are immutable, so a push to main
    # cannot be the trigger: the same version can never be published twice.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Tag matches the crate version
        run: |
          set -eu
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          tag=${GITHUB_REF_NAME#v}
          echo "tag=$tag crate=$version"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Already on crates.io?
        id: existing
        run: |
          set -eu
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          if curl -fsS -o /dev/null -H "User-Agent: riggate-ci (github.com/prashant-anand/riggate)" \
              "https://crates.io/api/v1/crates/riggate/$version" 2>/dev/null; then
            echo "riggate $version is already published; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.existing.outputs.skip == 'false'
        id: auth
      - name: cargo publish
        if: steps.existing.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  publish:
    # Independent of publish-crate: a crates.io configuration problem must not block the
    # binaries, and a binary failure must not leave the crate unpublished.
    needs: build
    # A dispatch run proves the matrix builds; it must not try to publish a release without a tag.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
