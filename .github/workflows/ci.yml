name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      # Catches a package that cannot be produced or built (missing files, bad manifest, a
      # dependency that only resolves from the workspace) on every push, instead of at the tag,
      # where a failed publish leaves the version half-released.
      - run: cargo package --locked
      # Audit runs last on purpose: a lockfile-only advisory should not skip the tests and the
      # release build, which are the checks that actually catch regressions in this codebase.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
